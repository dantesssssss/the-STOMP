[project]
name = "stomp-tester"
version = "0.1.0"
description = "Desktop tool for testing STOMP servers over WebSocket, SockJS and TCP"
requires-python = ">=3.10"
dependencies = [
    "pyside6-essentials>=6.7",
    "websocket-client>=1.8",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "websockets>=12",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
